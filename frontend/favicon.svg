<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient (Light Theme) -->
    <linearGradient id="eq-bg-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Background Gradient (Dark Theme) -->
    <linearGradient id="eq-bg-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>

    <!-- Star & Glow Gradients -->
    <radialGradient id="star-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="star-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <linearGradient id="tassel-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Top Gloss Ambient -->
    <radialGradient id="top-gloss" cx="50%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <style>
    .eq-bg { fill: url(#eq-bg-light); stroke: rgba(255, 255, 255, 0.25); stroke-width: 6; }
    @media (prefers-color-scheme: dark) {
      .eq-bg { fill: url(#eq-bg-dark); stroke: rgba(147, 197, 253, 0.45); stroke-width: 7; }
    }
  </style>

  <!-- Squircle Base (App Container) -->
  <rect class="eq-bg" x="16" y="16" width="480" height="480" rx="116" ry="116"/>
  
  <!-- Top Specular Highlight Gloss -->
  <rect x="16" y="16" width="480" height="480" rx="116" ry="116" fill="url(#top-gloss)"/>

  <!-- Mortarboard Soft Shadow -->
  <polygon points="256,142 444,236 256,330 68,236" fill="#0A193C" opacity="0.45" filter="url(#shadow-blur)"/>

  <!-- Skull Cap Base (under the diamond) -->
  <polygon points="148,246 148,332 196,374 256,386 316,374 364,332 364,246 256,298" fill="#E2E8F0"/>
  <path d="M 148,332 Q 256,400 364,332" fill="none" stroke="#CBD5E1" stroke-width="8" stroke-linecap="round"/>

  <!-- Mortarboard Diamond (Faceted 3D) -->
  <!-- Left Facet: Pure Brilliant White -->
  <polygon points="256,120 68,214 256,308" fill="#FFFFFF"/>
  <!-- Right Facet: Soft Cool Pearl White -->
  <polygon points="256,120 444,214 256,308" fill="#F1F5F9"/>
  <!-- Center Ridge -->
  <line x1="256" y1="120" x2="256" y2="308" stroke="#E2E8F0" stroke-width="3"/>

  <!-- Golden Tassel -->
  <!-- Center Button -->
  <circle cx="256" cy="214" r="18" fill="#F59E0B"/>
  <circle cx="256" cy="214" r="10" fill="#FBBF24"/>
  <!-- Cord -->
  <path d="M 256,214 C 205,220 155,250 110,330" fill="none" stroke="#F59E0B" stroke-width="12" stroke-linecap="round"/>
  <!-- Charm Ring -->
  <circle cx="110" cy="334" r="11" fill="#D97706"/>
  <circle cx="110" cy="334" r="7" fill="#FBBF24"/>
  <!-- Brush -->
  <polygon points="100,336 120,336 134,400 88,400" fill="url(#tassel-gold)"/>
  <line x1="104" y1="338" x2="94" y2="400" stroke="#FBBF24" stroke-width="3"/>
  <line x1="114" y1="338" x2="124" y2="400" stroke="#D97706" stroke-width="3"/>

  <!-- Quest Star Sparkle -->
  <!-- Ambient Glow -->
  <circle cx="402" cy="108" r="72" fill="url(#star-glow)"/>
  
  <!-- Primary 4-point Star -->
  <path d="M 402,52 Q 402,108 458,108 Q 402,108 402,164 Q 402,108 346,108 Q 402,108 402,52 Z" fill="url(#star-gold)"/>
  <!-- Star Core Highlight -->
  <path d="M 402,83 Q 402,108 427,108 Q 402,108 402,133 Q 402,108 377,108 Q 402,108 402,83 Z" fill="#FEF08A"/>

  <!-- Secondary Companion Sparkle -->
  <path d="M 452,142 Q 452,166 476,166 Q 452,166 452,190 Q 452,166 428,166 Q 452,166 452,142 Z" fill="#FDE047"/>
</svg>
