<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>EduQuest Collector</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #090d16;
      color: #f1f5f9;
      font-size: 13px;
      padding: 14px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .title-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .title {
      font-weight: 800;
      font-size: 15px;
      color: #38bdf8;
      letter-spacing: 0.2px;
    }
    .badge-ver {
      font-size: 10px;
      background: #0284c7;
      color: white;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 700;
    }
    .status-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: #111827;
      border-radius: 6px;
      font-size: 11.5px;
      margin-bottom: 12px;
      border: 1px solid #1f2937;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      flex-shrink: 0;
    }
    .dot.connected {
      background: #10b981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
    }

    /* Tabs Navigation */
    .tabs-nav {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 6px;
    }
    .tab-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid #1e293b;
      background: #0f172a;
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tab-btn:hover {
      background: #1e293b;
      color: #f8fafc;
    }
    .tab-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
      font-weight: 700;
    }
    .tab-count-badge {
      background: rgba(255, 255, 255, 0.2);
      padding: 1px 6px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 700;
    }

    /* Quick Action Buttons */
    .quick-actions {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    .quick-btn {
      flex: 1;
      padding: 7px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f1f5f9;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: background 0.15s ease;
    }
    .quick-btn:hover {
      background: #334155;
    }
    .quick-btn.primary {
      background: #2563eb;
      border-color: #3b82f6;
    }
    .quick-btn.primary:hover {
      background: #1d4ed8;
    }

    /* Tab Contents */
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    /* Questions Viewer Tab */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
      margin-bottom: 8px;
      color: #94a3b8;
    }
    .link-btn {
      background: none;
      border: none;
      color: #38bdf8;
      cursor: pointer;
      font-size: 11px;
      text-decoration: underline;
    }
    .link-btn.danger {
      color: #f87171;
    }
    .scanned-list {
      max-height: 290px;
      overflow-y: auto;
      background: #0d1322;
      border-radius: 8px;
      padding: 10px;
      border: 1px solid #1e293b;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .scanned-item {
      background: #151d30;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #23304c;
      font-size: 11.5px;
    }
    .btn-del-single-popup {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 13px;
      padding: 1px 5px;
      border-radius: 4px;
      line-height: 1;
      transition: all 0.15s ease;
    }
    .btn-del-single-popup:hover {
      background: #450a0a;
      color: #f87171;
    }

    /* Debug Log Tab */
    .log-controls {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
    }
    .log-action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .log-pills-row {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .log-pill {
      font-size: 10px;
      padding: 3px 6px;
      border-radius: 4px;
      border: 1px solid #1e293b;
      background: #0f172a;
      color: #94a3b8;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    .log-pill:hover {
      background: #1e293b;
      color: #f1f5f9;
    }
    .log-pill.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: white;
      font-weight: 700;
    }
    .log-search-box {
      position: relative;
      display: flex;
      align-items: center;
    }
    .log-search-input {
      width: 100%;
      background: #0d1322;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 5px 24px 5px 8px;
      font-size: 11px;
      color: #f8fafc;
      outline: none;
    }
    .log-search-input:focus {
      border-color: #38bdf8;
    }
    .clear-search-btn {
      position: absolute;
      right: 6px;
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 11px;
    }

    /* Monospace Terminal */
    .terminal-container {
      max-height: 290px;
      overflow-y: auto;
      background: #040711;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 8px 10px;
      font-family: "Fira Code", Consolas, Menlo, Monaco, monospace;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .terminal-row {
      line-height: 1.4;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 4px;
      cursor: pointer;
      transition: background 0.1s ease;
    }
    .terminal-row:hover {
      background: rgba(255, 255, 255, 0.03);
    }
    .terminal-time {
      color: #64748b;
      font-size: 10px;
      margin-right: 4px;
    }
    .terminal-badge {
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 9px;
      font-weight: 700;
      margin-right: 4px;
    }
    .badge-success { background: #052e16; color: #4ade80; }
    .badge-skip { background: #451a03; color: #fbbf24; }
    .badge-error { background: #450a0a; color: #f87171; }
    .badge-net { background: #3b0764; color: #c084fc; }
    .badge-info { background: #082f49; color: #38bdf8; }

    .footer {
      margin-top: 12px;
      font-size: 10.5px;
      color: #64748b;
      text-align: center;
      border-top: 1px solid #1e293b;
      padding-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-group">
      <div class="title">⚡ EduQuest Collector</div>
      <span class="badge-ver">v1.3.12</span>
    </div>
  </div>

  <div class="status-bar" id="status-box">
    <div class="dot" id="status-dot"></div>
    <span id="status-text">Đang kiểm tra kết nối port 8000...</span>
  </div>

  <!-- Navigation Tabs -->
  <div class="tabs-nav">
    <button class="tab-btn active" id="btn-tab-questions" data-tab="tab-questions">
      <span>📋 Câu hỏi đã bắt</span>
      <span class="tab-count-badge" id="popup-questions-count">0</span>
    </button>
    <button class="tab-btn" id="btn-tab-logs" data-tab="tab-logs">
      <span>🔍 Nhật ký Debug</span>
      <span class="tab-count-badge" id="popup-logs-count">0</span>
    </button>
  </div>

  <!-- Quick Action Controls -->
  <div class="quick-actions">
    <button class="quick-btn primary" id="btn-harvest-all-tab" title="Duyệt câu hỏi & cào toàn bộ">🚀 Cào tất cả</button>
    <button class="quick-btn" id="btn-scan-tab" title="Quét màn hình hiện tại">🎯 Quét nhanh</button>
    <a href="http://localhost:8000" target="_blank" class="quick-btn" title="Mở trang chủ EduQuest">🌐 Dashboard</a>
  </div>

  <!-- Tab 1: Questions List -->
  <div class="tab-content active" id="tab-questions">
    <div class="section-header">
      <span>Danh sách đã quét trong phiên:</span>
      <div style="display: flex; gap: 8px;">
        <button class="link-btn" id="btn-save-all-popup">💾 Lưu tất cả</button>
        <button class="link-btn danger" id="btn-clear-scanned-popup">🗑️ Xóa</button>
      </div>
    </div>
    <div class="scanned-list" id="popup-scanned-list"></div>
  </div>

  <!-- Tab 2: Debug Telemetry Log -->
  <div class="tab-content" id="tab-logs">
    <div class="log-controls">
      <div class="log-action-bar">
        <span style="font-size: 11px; font-weight: 700; color: #38bdf8;">Nhật ký Telemetry (Real-time):</span>
        <div style="display: flex; gap: 6px;">
          <button class="link-btn" id="btn-copy-logs-popup">📋 Sao chép</button>
          <button class="link-btn danger" id="btn-clear-logs-popup">🗑️ Xóa log</button>
          <button class="link-btn" id="btn-refresh-logs-popup">🔄 Làm mới</button>
        </div>
      </div>

      <!-- Filter Pills -->
      <div class="log-pills-row">
        <button class="log-pill active" data-filter="all">Tất cả (<span id="count-log-all">0</span>)</button>
        <button class="log-pill" data-filter="success" style="color: #4ade80;">Thành công (<span id="count-log-success">0</span>)</button>
        <button class="log-pill" data-filter="skip" style="color: #fbbf24;">Bỏ qua (<span id="count-log-skip">0</span>)</button>
        <button class="log-pill" data-filter="net" style="color: #c084fc;">Mạng (<span id="count-log-net">0</span>)</button>
        <button class="log-pill" data-filter="error" style="color: #f87171;">Lỗi (<span id="count-log-error">0</span>)</button>
      </div>

      <!-- Live Search Box -->
      <div class="log-search-box">
        <input type="text" class="log-search-input" id="popup-log-search-input" placeholder="🔍 Tìm kiếm log (URL, UUID, lỗi, từ khóa...)" />
        <button class="clear-search-btn" id="btn-clear-search" style="display: none;">✕</button>
      </div>
    </div>

    <!-- Terminal Console -->
    <div class="terminal-container" id="popup-terminal-list"></div>
  </div>

  <div class="footer">
    Hỗ trợ VioEdu, Trạng Nguyên, Hành Trang Số, CodeMath, VietJack...
  </div>

  <script src="popup.js"></script>
</body>
</html>
