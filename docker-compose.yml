services:
  eduquest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eduquest-pro
    image: eduquest-pro:latest

    # ── Ports ───────────────────────────────────
    ports:
      - "8000:8000"          # Web Dashboard + API (http://localhost:8000)
      - "80:8000"            # Truy cập trực tiếp cổng 80 (http://localhost)

    # ── Volumes (dữ liệu bền vững) ──────────────
    # Tất cả dữ liệu lưu trong ./data/ trên máy host
    # → Xóa/rebuild container KHÔNG MẤT dữ liệu
    volumes:
      - ./data:/app/data     # questions.db + media/ + models/

    # ── Tự động khởi động lại ───────────────────
    # unless-stopped: tự restart khi crash hoặc khi Windows reboot
    # (trừ khi bạn chủ động chạy "docker stop")
    restart: unless-stopped

    # ── Environment ─────────────────────────────
    environment:
      - PYTHONUNBUFFERED=1   # Log hiện ngay, không buffer
      - PYTHONDONTWRITEBYTECODE=1
      - TZ=Asia/Ho_Chi_Minh  # Đồng bộ múi giờ Việt Nam (UTC+7)
      - CUSTOM_VISION_URL=http://host.docker.internal:20129/v1 # Kết nối trực tiếp 9Router trên Windows
      - DOCKER_CONTAINER=1
      - CORS_ORIGINS=https://${NGROK_DOMAIN:-otter-scrawny-squall.ngrok-free.dev}

    # ── Host network bridge ─────────────────────
    # Cho phép container Docker kết nối ra các dịch vụ chạy trên Windows Host (9Router port 20129)
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # ── Resource limits (tùy chỉnh nếu cần) ────
    # Giới hạn RAM để không ảnh hưởng các ứng dụng khác trên máy chủ
    deploy:
      resources:
        limits:
          memory: 1g         # Tối đa 1GB RAM
        reservations:
          memory: 256m       # Đảm bảo tối thiểu 256MB

    # ── Health check ────────────────────────────
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/stats/count"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    # ── Logging ─────────────────────────────────
    logging:
      driver: "json-file"
      options:
        max-size: "10m"      # Mỗi file log tối đa 10MB
        max-file: "3"        # Giữ tối đa 3 file log xoay vòng

  # ── ngrok Tunnel (Chế độ Chia sẻ Internet 24/7) ──────────────
  # Chạy ngầm hoàn toàn trong Docker, không cần mở cửa sổ CMD
  # Tự động kết nối lại khi rớt mạng hoặc khi Windows khởi động lại
  ngrok:
    image: ngrok/ngrok:latest
    container_name: eduquest-ngrok
    restart: unless-stopped
    command:
      - "http"
      - "--url=${NGROK_DOMAIN:-otter-scrawny-squall.ngrok-free.dev}"
      - "eduquest:8000"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-3KAMkuzJ2qBcImaplnaUtIIMEBE_67eVLXreqJoWkGN3uTRL3}
    depends_on:
      eduquest:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
